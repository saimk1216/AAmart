{% extends "admin_base.html" %}{% block admincontent %}<div class="sectionhead"><h1>Products</h1><a class="btn" href="{{ url_for('product_form') }}">+ Add product</a></div><div class="tablewrap"><table><tr><th>Product</th><th>Price</th><th>Stock</th><th>Visibility</th><th>Actions</th></tr>{% for p in products %}<tr><td>{{ p.name }}</td><td>₹{{ p.price }}</td><td>{{ p.stock }}</td><td>{{ 'Active' if p.active else 'Hidden' }}</td><td><a href="{{ url_for('product_form',product_id=p.id) }}">Edit</a> <form class="inline" method="post" action="{{ url_for('delete_product',product_id=p.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="danger linkbtn">Hide</button></form></td></tr>{% endfor %}</table></div>{% endblock %}
