{% extends "base.html" %}{% block content %}<div class="formbox"><h1>{{ 'Create account' if mode=='register' else 'Login' }}</h1><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">{% if mode=='register' %}<label>Username<input name="username" required minlength="3"></label><label>Email<input type="email" name="email" required></label>{% else %}<label>Username or email<input name="identity" required></label>{% endif %}<label>Password<input type="password" name="password" required minlength="8"></label><button class="btn full">{{ 'Register' if mode=='register' else 'Login' }}</button></form><p>{% if mode=='register' %}Already registered? <a href="{{ url_for('login') }}">Login</a>{% else %}New here? <a href="{{ url_for('register') }}">Create account</a>{% endif %}</p></div>{% endblock %}
