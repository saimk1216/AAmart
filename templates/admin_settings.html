{% extends "admin_base.html" %}{% block admincontent %}<div class="formbox wide"><h1>Store editor</h1><p>Yahan se store ka basic branding update karein.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Website name<input name="store_name" value="{{ setting.store_name }}"></label><label>Tagline<input name="tagline" value="{{ setting.tagline }}"></label><label>Contact email<input type="email" name="contact_email" value="{{ setting.contact_email }}"></label><label>Contact phone<input name="contact_phone" value="{{ setting.contact_phone }}"></label><label>Primary color<input type="color" name="primary_color" value="{{ setting.primary_color }}"></label><button class="btn full">Save settings</button></form></div>{% endblock %}
